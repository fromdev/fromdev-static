<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prompt Builder — Article & SEO Titles</title>
  <style>
    :root {
      --bg: #0f1724;
      --card: #0b1220;
      --muted: #94a3b8;
      --accent: #7c3aed;
      --radius: 14px;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto;
      background: linear-gradient(180deg, var(--bg), #071024 120%);
      color: #e6eef8;
      display: flex;
      justify-content: center;
      padding: 28px;
    }
    .wrapper {
      width: 100%;
      max-width: 980px;
      background: linear-gradient(180deg, var(--card), rgba(11, 18, 32, 0.9));
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.6);
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), #5b21b6);
      font-weight: bold;
    }
    h1 { font-size: 1.2rem; margin: 0; }
    p.lead { font-size: 0.9rem; color: var(--muted); margin: 0; }
    .controls {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: transparent;
      color: #fff;
      font-size: 1rem;
    }
    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(90deg, var(--accent), #5b21b6);
      color: #fff;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--muted);
    }
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: transparent;
      color: #fff;
      font-family: ui-monospace, monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      resize: vertical;
    }
    .output-block {
      margin-top: 20px;
    }
    .output-block h2 {
      font-size: 1rem;
      margin-bottom: 6px;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="logo">PB</div>
      <div>
        <h1>Prompt Builder — Article & SEO Titles</h1>
        <p class="lead">Generate writing prompts for articles and SEO title ideas.</p>
      </div>
    </header>

    <div class="controls">
      <label for="topicInput">Enter topic or article title:</label>
      <input id="topicInput" type="text" placeholder="e.g. Benefits of Remote Work" />
      <div style="display:flex; gap:10px;">
        <button id="generateBtn" class="btn-primary" type="button">Generate Prompts</button>
        <button id="clearBtn" class="btn-secondary" type="button">Clear</button>
      </div>
      <p id="status" style="font-size:0.85rem;color:var(--muted);margin:0;">Ready.</p>
    </div>

    <div class="output-block">
      <h2>Article Prompt</h2>
      <textarea id="articlePrompt" readonly rows="14"></textarea>
    </div>

    <div class="output-block">
      <h2>SEO Titles & Excerpt Prompt</h2>
      <textarea id="seoPrompt" readonly rows="5"></textarea>
    </div>
  </div>

  <script>
    const topicInput = document.getElementById('topicInput');
    const generateBtn = document.getElementById('generateBtn');
    const clearBtn = document.getElementById('clearBtn');
    const articlePrompt = document.getElementById('articlePrompt');
    const seoPrompt = document.getElementById('seoPrompt');
    const status = document.getElementById('status');

    const ARTICLE_TEMPLATE = `Write a detailed, SEO-optimized article on the topic \${title}. Structure the article professionally with clear HTML headings (<H1>, <H2>, <H3>) and use natural keyword integration to maximize search engine visibility.

The article must:
- Be 800 to 1000 words.
- Use HTML formatting.
- Have a H1 heading that is different from the post title.
- Include an engaging introduction and a strong conclusion.
- Use bullet points, numbered lists, and short paragraphs for easy readability.

Apply clean HTML formatting and Donot add inline styles.

Example Article Format:
<h1>[ARTICLE_HEADING]</h1>
<p>[ARTICLE_INTRODUCTION_PARAGRAPH]</p>
<h2>[SECTION_1_HEADING]</h2>
<p>[SECTION_1_CONTENT_PARAGRAPH_1]</p>
<p>[SECTION_1_CONTENT_PARAGRAPH_2]</p>

<h2>[SECTION_2_HEADING]</h2>
<p>[SECTION_2_CONTENT_PARAGRAPH_1]</p>

<h3>[SUBSECTION_2A_HEADING]</h3>
<p>[SUBSECTION_2A_CONTENT]</p>
<ul>
    <li>[LIST_ITEM_1]</li>
    <li>[LIST_ITEM_2]</li>
    <li>[LIST_ITEM_3]</li>
</ul>
<h2>[SECTION_3_HEADING]</h2>
<p>[SECTION_3_CONTENT_PARAGRAPH_1]</p>
<p>[SECTION_3_CONTENT_PARAGRAPH_2]</p>
<h2>Conclusion</h2>
<p>[CONCLUSION_PARAGRAPH]</p>

Write in a friendly, conversational, and informative tone, ensuring the article is factually accurate, well-researched, and engaging for readers.

Act strictly as a Content Writer — deliver only the article content without any explanations, notes, or extra text. Your content will be published automatically.`;

    const SEO_TEMPLATE = `Generate 2 SEO optimized titles and an excerpt for this topic: \${title}`;

    function generatePrompts() {
      const title = topicInput.value.trim();
      if (!title) {
        status.textContent = 'Please enter a topic first.';
        return;
      }
      articlePrompt.value = ARTICLE_TEMPLATE.replace(/\$\{title\}/g, title);
      seoPrompt.value = SEO_TEMPLATE.replace(/\$\{title\}/g, title);
      status.textContent = 'Prompts generated successfully.';
    }

    function clearFields() {
      topicInput.value = '';
      articlePrompt.value = '';
      seoPrompt.value = '';
      status.textContent = 'Cleared.';
    }

    generateBtn.addEventListener('click', generatePrompts);
    clearBtn.addEventListener('click', clearFields);
  </script>
</body>
</html>
