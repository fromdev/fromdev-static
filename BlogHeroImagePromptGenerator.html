<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Hero Image Prompt Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .title {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            color: white;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: rgba(255,255,255,0.9);
            font-weight: 300;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        label {
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        input, select, textarea {
            padding: 1rem 1.25rem;
            border: none;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            font-size: 1rem;
            font-weight: 500;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            font-size: clamp(1rem, 1.5vw, 1.1rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 150px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 10px 30px rgba(238, 90, 36, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(238, 90, 36, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-3px);
        }

        .output-section {
            margin-top: 2rem;
        }

        .output-container {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .output-text {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 2rem;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            min-height: 150px;
        }

        .copy-btn {
            margin-top: 1rem;
            background: linear-gradient(135deg, #48cae4, #0077b6);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 119, 182, 0.3);
        }

        .theme-applied {
            background: rgba(72, 202, 228, 0.1) !important;
            border-left: 4px solid #48cae4 !important;
            transition: all 0.3s ease !important;
        }

        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            animation: float 6s ease-in-out infinite;
        }

        .floating-circle:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-circle:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-circle:nth-child(3) {
            width: 80px;
            height: 80px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .glass-card {
                padding: 1.5rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .button-group {
                flex-direction: column;
                align-items: center;
            }
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="floating-elements">
        <div class="floating-circle"></div>
        <div class="floating-circle"></div>
        <div class="floating-circle"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1 class="title">Blog Hero Image Generator</h1>
            <p class="subtitle">Create professional AI prompts for stunning blog hero images</p>
        </div>

        <div class="glass-card">
            <form id="promptForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="topic">Topic Keyword</label>
                        <input type="text" id="topic" placeholder="e.g., artificial intelligence, remote work" required>
                    </div>

                    <div class="form-group">
                        <label for="theme">Quick Theme (Optional)</label>
                        <select id="theme" onchange="applyTheme()">
                            <option value="">Select a theme or customize manually...</option>
                            <option value="tech-innovation">🚀 Tech Innovation</option>
                            <option value="business-professional">💼 Business Professional</option>
                            <option value="creative-agency">🎨 Creative Agency</option>
                            <option value="wellness-lifestyle">🌿 Wellness & Lifestyle</option>
                            <option value="education-learning">📚 Education & Learning</option>
                            <option value="startup-modern">⚡ Startup Modern</option>
                            <option value="luxury-premium">✨ Luxury Premium</option>
                            <option value="eco-sustainable">🌱 Eco Sustainable</option>
                            <option value="finance-trust">🏛️ Finance & Trust</option>
                            <option value="healthcare-medical">🏥 Healthcare & Medical</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="style">Visual Style</label>
                        <select id="style" required>
                            <option value="">Select style...</option>
                            <option value="photographic/realistic">Photographic/Realistic</option>
                            <option value="illustration/vector art">Illustration/Vector Art</option>
                            <option value="abstract/conceptual">Abstract/Conceptual</option>
                            <option value="minimalist/clean">Minimalist/Clean</option>
                            <option value="infographic-style">Infographic Style</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="mood">Mood/Emotion</label>
                        <select id="mood" required>
                            <option value="">Select mood...</option>
                            <option value="professional and trustworthy">Professional & Trustworthy</option>
                            <option value="innovative and cutting-edge">Innovative & Cutting-edge</option>
                            <option value="warm and approachable">Warm & Approachable</option>
                            <option value="dynamic and energetic">Dynamic & Energetic</option>
                            <option value="calm and contemplative">Calm & Contemplative</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="audience">Target Audience</label>
                        <select id="audience" required>
                            <option value="">Select audience...</option>
                            <option value="business professionals">Business Professionals</option>
                            <option value="tech enthusiasts">Tech Enthusiasts</option>
                            <option value="general consumers">General Consumers</option>
                            <option value="students/educators">Students/Educators</option>
                            <option value="entrepreneurs">Entrepreneurs</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="colors">Color Scheme</label>
                        <select id="colors" required>
                            <option value="">Select colors...</option>
                            <option value="blue and white">Blue & White (Trust, Technology)</option>
                            <option value="green and earth tones">Green & Earth Tones (Sustainability)</option>
                            <option value="bold and vibrant">Bold & Vibrant (Energy, Creativity)</option>
                            <option value="monochromatic">Monochromatic (Elegance, Focus)</option>
                            <option value="warm golden tones">Warm Golden Tones (Premium, Luxury)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="composition">Composition Style</label>
                        <select id="composition" required>
                            <option value="">Select composition...</option>
                            <option value="centered and balanced">Centered & Balanced</option>
                            <option value="rule of thirds">Rule of Thirds</option>
                            <option value="dynamic diagonal">Dynamic Diagonal</option>
                            <option value="layered depth">Layered Depth</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="lighting">Lighting Type</label>
                        <select id="lighting" required>
                            <option value="">Select lighting...</option>
                            <option value="soft natural lighting">Soft Natural Lighting</option>
                            <option value="dramatic spotlight">Dramatic Spotlight</option>
                            <option value="bright and even">Bright & Even</option>
                            <option value="warm golden hour">Warm Golden Hour</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="elements">Specific Elements (Optional)</label>
                        <textarea id="elements" placeholder="e.g., laptop, modern office, people in action, technology devices"></textarea>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Generate Prompt</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset Form</button>
                </div>
            </form>
        </div>

        <div id="outputSection" class="output-section hidden">
            <div class="glass-card fade-in">
                <h2 style="color: white; font-size: clamp(1.5rem, 3vw, 2rem); margin-bottom: 1.5rem; text-align: center;">Generated Prompt</h2>
                <div class="output-container">
                    <div id="promptOutput" class="output-text"></div>
                    <button onclick="copyToClipboard()" class="copy-btn">📋 Copy to Clipboard</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('promptForm');
        const outputSection = document.getElementById('outputSection');
        const promptOutput = document.getElementById('promptOutput');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            generatePrompt();
        });

        // Theme presets
        const themes = {
            'tech-innovation': {
                style: 'abstract/conceptual',
                mood: 'innovative and cutting-edge',
                audience: 'tech enthusiasts',
                colors: 'blue and white',
                composition: 'dynamic diagonal',
                lighting: 'dramatic spotlight',
                elements: 'futuristic elements, geometric shapes, digital interfaces'
            },
            'business-professional': {
                style: 'photographic/realistic',
                mood: 'professional and trustworthy',
                audience: 'business professionals',
                colors: 'monochromatic',
                composition: 'centered and balanced',
                lighting: 'soft natural lighting',
                elements: 'modern office, professional setting, clean workspace'
            },
            'creative-agency': {
                style: 'illustration/vector art',
                mood: 'dynamic and energetic',
                audience: 'entrepreneurs',
                colors: 'bold and vibrant',
                composition: 'rule of thirds',
                lighting: 'bright and even',
                elements: 'creative tools, artistic elements, colorful design elements'
            },
            'wellness-lifestyle': {
                style: 'photographic/realistic',
                mood: 'calm and contemplative',
                audience: 'general consumers',
                colors: 'green and earth tones',
                composition: 'centered and balanced',
                lighting: 'warm golden hour',
                elements: 'natural elements, peaceful environment, organic textures'
            },
            'education-learning': {
                style: 'illustration/vector art',
                mood: 'warm and approachable',
                audience: 'students/educators',
                colors: 'blue and white',
                composition: 'layered depth',
                lighting: 'soft natural lighting',
                elements: 'books, learning materials, educational icons, knowledge symbols'
            },
            'startup-modern': {
                style: 'minimalist/clean',
                mood: 'innovative and cutting-edge',
                audience: 'entrepreneurs',
                colors: 'bold and vibrant',
                composition: 'dynamic diagonal',
                lighting: 'bright and even',
                elements: 'modern technology, startup environment, growth symbols'
            },
            'luxury-premium': {
                style: 'photographic/realistic',
                mood: 'professional and trustworthy',
                audience: 'business professionals',
                colors: 'warm golden tones',
                composition: 'rule of thirds',
                lighting: 'warm golden hour',
                elements: 'premium materials, elegant design, luxury items'
            },
            'eco-sustainable': {
                style: 'photographic/realistic',
                mood: 'calm and contemplative',
                audience: 'general consumers',
                colors: 'green and earth tones',
                composition: 'centered and balanced',
                lighting: 'soft natural lighting',
                elements: 'plants, renewable energy, eco-friendly elements, nature'
            },
            'finance-trust': {
                style: 'minimalist/clean',
                mood: 'professional and trustworthy',
                audience: 'business professionals',
                colors: 'blue and white',
                composition: 'centered and balanced',
                lighting: 'soft natural lighting',
                elements: 'financial symbols, charts, secure elements, trust indicators'
            },
            'healthcare-medical': {
                style: 'photographic/realistic',
                mood: 'warm and approachable',
                audience: 'general consumers',
                colors: 'blue and white',
                composition: 'rule of thirds',
                lighting: 'soft natural lighting',
                elements: 'medical equipment, healthcare professionals, clean medical environment'
            }
        };

        function applyTheme() {
            const selectedTheme = document.getElementById('theme').value;

            if (!selectedTheme) return;

            const themeData = themes[selectedTheme];
            if (!themeData) return;

            // Apply theme values to form fields
            document.getElementById('style').value = themeData.style;
            document.getElementById('mood').value = themeData.mood;
            document.getElementById('audience').value = themeData.audience;
            document.getElementById('colors').value = themeData.colors;
            document.getElementById('composition').value = themeData.composition;
            document.getElementById('lighting').value = themeData.lighting;
            document.getElementById('elements').value = themeData.elements;

            // Add visual feedback
            const selects = ['style', 'mood', 'audience', 'colors', 'composition', 'lighting'];
            selects.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                field.style.background = 'rgba(72, 202, 228, 0.1)';
                field.style.borderLeft = '4px solid #48cae4';
                setTimeout(() => {
                    field.style.background = 'rgba(255, 255, 255, 0.9)';
                    field.style.borderLeft = 'none';
                }, 1500);
            });

            const elementsField = document.getElementById('elements');
            elementsField.style.background = 'rgba(72, 202, 228, 0.1)';
            elementsField.style.borderLeft = '4px solid #48cae4';
            setTimeout(() => {
                elementsField.style.background = 'rgba(255, 255, 255, 0.9)';
                elementsField.style.borderLeft = 'none';
            }, 1500);
        }

        function generatePrompt() {
            const formData = new FormData(form);
            const data = {};

            // Get all form values
            for (let [key, value] of formData.entries()) {
                data[key] = value.trim();
            }

            // Get values directly from form elements for better control
            const topic = document.getElementById('topic').value.trim();
            const style = document.getElementById('style').value;
            const mood = document.getElementById('mood').value;
            const audience = document.getElementById('audience').value;
            const colors = document.getElementById('colors').value;
            const composition = document.getElementById('composition').value;
            const lighting = document.getElementById('lighting').value;
            const elements = document.getElementById('elements').value.trim();

            // Validate required fields
            if (!topic || !style || !mood || !audience || !colors || !composition || !lighting) {
                alert('Please fill in all required fields.');
                return;
            }

            // Generate the prompt
            let prompt = `Generate a ${style} hero image representing "${topic}". The image should convey ${mood} and appeal to ${audience}. `;

            if (elements) {
                prompt += `Include ${elements} without text overlays. `;
            } else {
                prompt += `The image should include relevant visual elements without text overlays. `;
            }

            prompt += `Use a ${colors} color palette. The composition should be ${composition} with ${lighting}. `;
            prompt += `Aspect ratio: 16:9, high resolution, suitable for blog header use.`;

            // Display the generated prompt
            promptOutput.textContent = prompt;
            outputSection.classList.remove('hidden');
            outputSection.classList.add('fade-in');

            // Scroll to output
            outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function resetForm() {
            form.reset();
            outputSection.classList.add('hidden');
            outputSection.classList.remove('fade-in');

            // Reset theme selection
            document.getElementById('theme').value = '';
        }

        function copyToClipboard() {
            const text = promptOutput.textContent;

            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopyFeedback();
                }).catch(() => {
                    fallbackCopyTextToClipboard(text);
                });
            } else {
                fallbackCopyTextToClipboard(text);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                document.execCommand('copy');
                showCopyFeedback();
            } catch (err) {
                alert('Failed to copy text. Please select and copy manually.');
            }

            document.body.removeChild(textArea);
        }

        function showCopyFeedback() {
            const copyBtn = document.querySelector('.copy-btn');
            const originalText = copyBtn.textContent;
            copyBtn.textContent = '✅ Copied!';
            copyBtn.style.background = 'linear-gradient(135deg, #00b894, #00a085)';

            setTimeout(() => {
                copyBtn.textContent = originalText;
                copyBtn.style.background = 'linear-gradient(135deg, #48cae4, #0077b6)';
            }, 2000);
        }

        // Add smooth animations to form elements
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input, select, textarea');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'scale(1.02)';
                    this.parentElement.style.transition = 'transform 0.2s ease';
                });

                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'scale(1)';
                });
            });
        });
    </script>
</body>
</html>
