<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Routine Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            color: white;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 30px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            align-items: center;
            justify-content: center;
        }

        .goal-pills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .goal-pill {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .goal-pill:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .goal-pill.active {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-color: white;
            transform: scale(1.05);
        }

        .duration-control {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.15);
            padding: 15px 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .duration-control label {
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .duration-slider {
            width: 200px;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
        }

        .duration-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .duration-value {
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            min-width: 60px;
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 10px;
        }

        .generate-btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .workout-results {
            margin-top: 30px;
        }

        .day-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .day-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .day-title {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .day-calories {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: clamp(1rem, 3vw, 1.2rem);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .exercises-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .exercise-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .exercise-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.02);
        }

        .exercise-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
        }

        .exercise-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
        }

        .exercise-sets {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: 600;
        }

        .exercise-category {
            font-style: italic;
            opacity: 0.7;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
        }

        .loading::after {
            content: '...';
            animation: dots 2s infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .goal-pills {
                justify-content: center;
            }
            
            .duration-control {
                flex-direction: column;
                gap: 10px;
            }
            
            .duration-slider {
                width: 100%;
            }
            
            .exercises-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💪 Workout Routine Generator</h1>
        
        <div class="controls">
            <div class="goal-pills">
                <div class="goal-pill active" data-goal="weight-loss">🔥 Weight Loss</div>
                <div class="goal-pill" data-goal="strength">💪 Strength</div>
                <div class="goal-pill" data-goal="endurance">🏃 Endurance</div>
                <div class="goal-pill" data-goal="cardio">❤️ Cardio</div>
                <div class="goal-pill" data-goal="flexibility">🧘 Flexibility</div>
            </div>
            
            <div class="duration-control">
                <label for="duration">Workout Duration:</label>
                <input type="range" id="duration" class="duration-slider" min="15" max="45" step="5" value="30">
                <div class="duration-value">30 min</div>
            </div>
            
            <button class="generate-btn" onclick="generateWorkout()">Generate Routine</button>
        </div>
        
        <div id="workout-results" class="workout-results"></div>
    </div>

    <script>
        // Exercise database with comprehensive data
        const exerciseDatabase = {
            'upper-body': {
                'strength': [
                    { name: 'Push-ups', calories: 8, reps: '10-15', bodyPart: 'chest' },
                    { name: 'Diamond Push-ups', calories: 10, reps: '8-12', bodyPart: 'triceps' },
                    { name: 'Pike Push-ups', calories: 9, reps: '8-12', bodyPart: 'shoulders' },
                    { name: 'Tricep Dips', calories: 7, reps: '10-15', bodyPart: 'triceps' },
                    { name: 'Wall Handstand', calories: 12, reps: '30-60s', bodyPart: 'shoulders' },
                    { name: 'Arm Circles', calories: 5, reps: '15-20', bodyPart: 'shoulders' },
                    { name: 'Shoulder Shrugs', calories: 4, reps: '15-20', bodyPart: 'shoulders' },
                    { name: 'Chest Squeeze', calories: 6, reps: '12-15', bodyPart: 'chest' }
                ],
                'cardio': [
                    { name: 'Arm Swings', calories: 6, reps: '30-45s', bodyPart: 'arms' },
                    { name: 'Shadow Boxing', calories: 12, reps: '45-60s', bodyPart: 'arms' },
                    { name: 'Arm Punches', calories: 8, reps: '30-45s', bodyPart: 'arms' },
                    { name: 'Cross Body Punches', calories: 10, reps: '30-45s', bodyPart: 'arms' }
                ],
                'flexibility': [
                    { name: 'Shoulder Rolls', calories: 3, reps: '10-15', bodyPart: 'shoulders' },
                    { name: 'Arm Stretches', calories: 2, reps: '30s each', bodyPart: 'arms' },
                    { name: 'Chest Opener', calories: 3, reps: '30-45s', bodyPart: 'chest' },
                    { name: 'Tricep Stretch', calories: 2, reps: '30s each', bodyPart: 'triceps' }
                ]
            },
            'lower-body': {
                'strength': [
                    { name: 'Squats', calories: 10, reps: '12-20', bodyPart: 'legs' },
                    { name: 'Lunges', calories: 8, reps: '10-15 each', bodyPart: 'legs' },
                    { name: 'Wall Sits', calories: 12, reps: '30-60s', bodyPart: 'legs' },
                    { name: 'Calf Raises', calories: 6, reps: '15-25', bodyPart: 'calves' },
                    { name: 'Single Leg Glute Bridge', calories: 7, reps: '10-15 each', bodyPart: 'glutes' },
                    { name: 'Step-ups', calories: 9, reps: '10-15 each', bodyPart: 'legs' },
                    { name: 'Leg Raises', calories: 8, reps: '12-18', bodyPart: 'legs' },
                    { name: 'Sumo Squats', calories: 11, reps: '12-18', bodyPart: 'legs' }
                ],
                'cardio': [
                    { name: 'High Knees (March)', calories: 10, reps: '30-45s', bodyPart: 'legs' },
                    { name: 'Leg Swings', calories: 7, reps: '15-20 each', bodyPart: 'legs' },
                    { name: 'Stationary Marching', calories: 8, reps: '45-60s', bodyPart: 'legs' },
                    { name: 'Side Steps', calories: 9, reps: '30-45s', bodyPart: 'legs' }
                ],
                'flexibility': [
                    { name: 'Hamstring Stretch', calories: 2, reps: '30s each', bodyPart: 'legs' },
                    { name: 'Quad Stretch', calories: 2, reps: '30s each', bodyPart: 'legs' },
                    { name: 'Calf Stretch', calories: 2, reps: '30s each', bodyPart: 'calves' },
                    { name: 'Hip Flexor Stretch', calories: 3, reps: '30s each', bodyPart: 'hips' }
                ]
            },
            'core': {
                'strength': [
                    { name: 'Plank', calories: 10, reps: '30-60s', bodyPart: 'core' },
                    { name: 'Side Plank', calories: 12, reps: '20-45s each', bodyPart: 'core' },
                    { name: 'Dead Bug', calories: 8, reps: '10-15 each', bodyPart: 'core' },
                    { name: 'Bird Dog', calories: 7, reps: '10-15 each', bodyPart: 'core' },
                    { name: 'Bicycle Crunches', calories: 9, reps: '15-25', bodyPart: 'core' },
                    { name: 'Russian Twists', calories: 8, reps: '15-25', bodyPart: 'core' },
                    { name: 'Leg Raises', calories: 10, reps: '10-15', bodyPart: 'core' },
                    { name: 'Modified V-ups', calories: 9, reps: '12-18', bodyPart: 'core' }
                ],
                'cardio': [
                    { name: 'Standing Oblique Crunches', calories: 8, reps: '15-20 each', bodyPart: 'core' },
                    { name: 'Marching in Place', calories: 7, reps: '45-60s', bodyPart: 'core' },
                    { name: 'Standing Knee to Elbow', calories: 9, reps: '15-20 each', bodyPart: 'core' }
                ],
                'flexibility': [
                    { name: 'Cat-Cow Stretch', calories: 3, reps: '10-15', bodyPart: 'core' },
                    { name: 'Seated Spinal Twist', calories: 2, reps: '30s each', bodyPart: 'core' },
                    { name: 'Cobra Stretch', calories: 3, reps: '30-45s', bodyPart: 'core' }
                ]
            },
            'full-body': {
                'strength': [
                    { name: 'Burpees (No Jump)', calories: 15, reps: '5-10', bodyPart: 'full-body' },
                    { name: 'Mountain Climbers (Slow)', calories: 12, reps: '10-15 each', bodyPart: 'full-body' },
                    { name: 'Bear Crawl', calories: 14, reps: '10-15 steps', bodyPart: 'full-body' },
                    { name: 'Inchworms', calories: 11, reps: '8-12', bodyPart: 'full-body' },
                    { name: 'Squat to Press', calories: 13, reps: '10-15', bodyPart: 'full-body' }
                ],
                'cardio': [
                    { name: 'Arm and Leg Swings', calories: 10, reps: '30-45s', bodyPart: 'full-body' },
                    { name: 'Cross Body Reaches', calories: 8, reps: '15-20 each', bodyPart: 'full-body' },
                    { name: 'Standing Cardio Combo', calories: 12, reps: '45-60s', bodyPart: 'full-body' }
                ],
                'flexibility': [
                    { name: 'Full Body Stretch Flow', calories: 5, reps: '60-90s', bodyPart: 'full-body' },
                    { name: 'Gentle Yoga Flow', calories: 6, reps: '60-90s', bodyPart: 'full-body' },
                    { name: 'Dynamic Warm-up', calories: 7, reps: '45-60s', bodyPart: 'full-body' }
                ]
            }
        };

        // Goal preferences for exercise selection
        const goalPreferences = {
            'weight-loss': { strength: 0.3, cardio: 0.5, flexibility: 0.2 },
            'strength': { strength: 0.6, cardio: 0.2, flexibility: 0.2 },
            'endurance': { strength: 0.3, cardio: 0.5, flexibility: 0.2 },
            'cardio': { strength: 0.2, cardio: 0.6, flexibility: 0.2 },
            'flexibility': { strength: 0.2, cardio: 0.2, flexibility: 0.6 }
        };

        let currentGoal = 'weight-loss';
        let currentDuration = 30;

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            const goalPills = document.querySelectorAll('.goal-pill');
            const durationSlider = document.getElementById('duration');
            const durationValue = document.querySelector('.duration-value');

            goalPills.forEach(pill => {
                pill.addEventListener('click', function() {
                    goalPills.forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                    currentGoal = this.dataset.goal;
                });
            });

            durationSlider.addEventListener('input', function() {
                currentDuration = parseInt(this.value);
                durationValue.textContent = currentDuration + ' min';
            });
        });

        function generateWorkout() {
            const resultsDiv = document.getElementById('workout-results');
            resultsDiv.innerHTML = '<div class="loading">Generating your personalized workout routine</div>';

            setTimeout(() => {
                const workoutPlan = createWorkoutPlan();
                displayWorkoutPlan(workoutPlan);
            }, 1500);
        }

        function createWorkoutPlan() {
            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
            const bodyParts = ['upper-body', 'lower-body', 'core', 'full-body'];
            const plan = [];

            days.forEach((day, index) => {
                const dayPlan = {
                    day: day,
                    exercises: [],
                    totalCalories: 0
                };

                // Determine focus for the day
                const focusBodyPart = bodyParts[index % bodyParts.length];
                const exercisesNeeded = Math.floor(currentDuration / 5) + 2;
                const preferences = goalPreferences[currentGoal];

                // Get exercises based on preferences
                const selectedExercises = selectExercisesForDay(focusBodyPart, exercisesNeeded, preferences);
                
                selectedExercises.forEach(exercise => {
                    const sets = Math.min(3, Math.floor(Math.random() * 3) + 1);
                    const totalCalories = exercise.calories * sets;
                    
                    dayPlan.exercises.push({
                        ...exercise,
                        sets: sets,
                        totalCalories: totalCalories
                    });
                    
                    dayPlan.totalCalories += totalCalories;
                });

                plan.push(dayPlan);
            });

            return plan;
        }

        function selectExercisesForDay(focusBodyPart, exercisesNeeded, preferences) {
            const selectedExercises = [];
            const usedExercises = new Set();

            // Get exercises from focus body part first
            const focusExercises = exerciseDatabase[focusBodyPart];
            if (focusExercises) {
                Object.keys(preferences).forEach(type => {
                    const typeExercises = focusExercises[type] || [];
                    const count = Math.floor(exercisesNeeded * preferences[type]);
                    
                    for (let i = 0; i < count && typeExercises.length > 0; i++) {
                        const randomIndex = Math.floor(Math.random() * typeExercises.length);
                        const exercise = typeExercises[randomIndex];
                        
                        if (!usedExercises.has(exercise.name)) {
                            selectedExercises.push({ ...exercise, category: type });
                            usedExercises.add(exercise.name);
                        }
                    }
                });
            }

            // Fill remaining slots with exercises from other body parts
            while (selectedExercises.length < exercisesNeeded) {
                const randomBodyPart = Object.keys(exerciseDatabase)[Math.floor(Math.random() * Object.keys(exerciseDatabase).length)];
                const bodyPartExercises = exerciseDatabase[randomBodyPart];
                const randomType = Object.keys(bodyPartExercises)[Math.floor(Math.random() * Object.keys(bodyPartExercises).length)];
                const exercises = bodyPartExercises[randomType];
                
                if (exercises && exercises.length > 0) {
                    const randomExercise = exercises[Math.floor(Math.random() * exercises.length)];
                    
                    if (!usedExercises.has(randomExercise.name)) {
                        selectedExercises.push({ ...randomExercise, category: randomType });
                        usedExercises.add(randomExercise.name);
                    }
                }
            }

            return selectedExercises;
        }

        function displayWorkoutPlan(plan) {
            const resultsDiv = document.getElementById('workout-results');
            let html = '';

            plan.forEach(day => {
                html += `
                    <div class="day-card">
                        <div class="day-header">
                            <h2 class="day-title">${day.day}</h2>
                            <div class="day-calories">${day.totalCalories} calories</div>
                        </div>
                        <div class="exercises-grid">
                `;

                day.exercises.forEach(exercise => {
                    html += `
                        <div class="exercise-card">
                            <div class="exercise-name">${exercise.name}</div>
                            <div class="exercise-details">
                                <span class="exercise-category">${exercise.category} • ${exercise.bodyPart}</span>
                                <span class="exercise-sets">${exercise.sets} sets • ${exercise.reps}</span>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
