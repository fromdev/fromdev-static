<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Routine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 900;
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .control-group:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        select, button {
            padding: 0.8rem 1.2rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            min-width: 150px;
        }

        button {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            box-shadow: 0 4px 15px rgba(238, 90, 82, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(238, 90, 82, 0.6);
        }

        .workout-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .day-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .day-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .day-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ffeaa7);
            border-radius: 24px 24px 0 0;
        }

        .day-title {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 800;
            margin-bottom: 1rem;
            text-align: center;
        }

        .duration-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: center;
            width: 100%;
        }

        .exercise-list {
            list-style: none;
        }

        .exercise-item {
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 0.8rem;
            padding: 1rem;
            border-radius: 12px;
            border-left: 4px solid #4ecdc4;
            transition: all 0.3s ease;
            position: relative;
        }

        .exercise-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .exercise-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
        }

        .exercise-details {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .floating-circle:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-circle:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }

        .floating-circle:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 80%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        .timer-section {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .timer-display {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 900;
            margin: 1rem 0;
            color: #4ecdc4;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .workout-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="floating-elements">
        <div class="floating-circle"></div>
        <div class="floating-circle"></div>
        <div class="floating-circle"></div>
    </div>

    <div class="container">
        <h1>💪 Workout Routine</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="daySelect">Select Day:</label>
                <select id="daySelect">
                    <option value="all">All Days</option>
                    <option value="0">Monday - Upper Body Strength</option>
                    <option value="1">Tuesday - Cardio & Core</option>
                    <option value="2">Wednesday - Lower Body Power</option>
                    <option value="3">Thursday - HIIT & Flexibility</option>
                    <option value="4">Friday - Full Body Circuit</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="durationSelect">Workout Duration:</label>
                <select id="durationSelect">
                    <option value="20">20 Minutes</option>
                    <option value="30" selected>30 Minutes</option>
                    <option value="45">45 Minutes</option>
                </select>
            </div>
            
            <div class="control-group">
                <button onclick="generateWorkout()">Generate Routine</button>
            </div>
        </div>

        <div class="timer-section" id="timerSection" style="display: none;">
            <h3>Workout Timer</h3>
            <div class="timer-display" id="timerDisplay">00:00</div>
            <button onclick="startTimer()" id="timerBtn">Start Timer</button>
            <button onclick="resetTimer()" style="margin-left: 1rem;">Reset</button>
        </div>

        <div class="workout-grid" id="workoutContainer">
            <!-- Workout cards will be dynamically generated here -->
        </div>
    </div>

    <script>
        const workoutData = {
            0: { // Day 1 - Upper Body Strength
                title: "Upper Body Strength",
                exercises: {
                    20: [
                        { name: "Push-ups", details: "3 sets × 8-12 reps" },
                        { name: "Tricep Dips", details: "3 sets × 10-12 reps" },
                        { name: "Pike Push-ups", details: "2 sets × 6-10 reps" },
                        { name: "Plank", details: "3 sets × 30-45 seconds" },
                        { name: "Arm Circles", details: "2 sets × 15 each direction" }
                    ],
                    30: [
                        { name: "Push-ups", details: "4 sets × 10-15 reps" },
                        { name: "Tricep Dips", details: "3 sets × 12-15 reps" },
                        { name: "Pike Push-ups", details: "3 sets × 8-12 reps" },
                        { name: "Diamond Push-ups", details: "2 sets × 5-8 reps" },
                        { name: "Plank", details: "3 sets × 45-60 seconds" },
                        { name: "Side Plank", details: "2 sets × 30 seconds each side" },
                        { name: "Arm Circles", details: "3 sets × 20 each direction" }
                    ],
                    45: [
                        { name: "Push-ups", details: "5 sets × 12-20 reps" },
                        { name: "Tricep Dips", details: "4 sets × 15-20 reps" },
                        { name: "Pike Push-ups", details: "4 sets × 10-15 reps" },
                        { name: "Diamond Push-ups", details: "3 sets × 8-12 reps" },
                        { name: "Decline Push-ups", details: "3 sets × 8-12 reps" },
                        { name: "Plank", details: "4 sets × 60-90 seconds" },
                        { name: "Side Plank", details: "3 sets × 45 seconds each side" },
                        { name: "Bear Crawl", details: "3 sets × 30 seconds" },
                        { name: "Arm & Shoulder Stretches", details: "5 minutes" }
                    ]
                }
            },
            1: { // Day 2 - Cardio & Core
                title: "Cardio & Core",
                exercises: {
                    20: [
                        { name: "High Knees (in place)", details: "3 sets × 30 seconds" },
                        { name: "Bicycle Crunches", details: "3 sets × 20 reps" },
                        { name: "Russian Twists", details: "3 sets × 25 reps" },
                        { name: "Mountain Climbers", details: "3 sets × 30 seconds" },
                        { name: "Dead Bug", details: "2 sets × 10 each side" }
                    ],
                    30: [
                        { name: "High Knees (in place)", details: "4 sets × 45 seconds" },
                        { name: "Bicycle Crunches", details: "4 sets × 30 reps" },
                        { name: "Russian Twists", details: "4 sets × 35 reps" },
                        { name: "Mountain Climbers", details: "4 sets × 45 seconds" },
                        { name: "Dead Bug", details: "3 sets × 12 each side" },
                        { name: "Leg Raises", details: "3 sets × 12-15 reps" },
                        { name: "Plank Up-Downs", details: "3 sets × 10 reps" }
                    ],
                    45: [
                        { name: "High Knees (in place)", details: "5 sets × 60 seconds" },
                        { name: "Bicycle Crunches", details: "5 sets × 40 reps" },
                        { name: "Russian Twists", details: "5 sets × 50 reps" },
                        { name: "Mountain Climbers", details: "5 sets × 60 seconds" },
                        { name: "Dead Bug", details: "4 sets × 15 each side" },
                        { name: "Leg Raises", details: "4 sets × 20 reps" },
                        { name: "Plank Up-Downs", details: "4 sets × 15 reps" },
                        { name: "Flutter Kicks", details: "3 sets × 30 seconds" },
                        { name: "Core Stretches", details: "5 minutes" }
                    ]
                }
            },
            2: { // Day 3 - Lower Body Power
                title: "Lower Body Power",
                exercises: {
                    20: [
                        { name: "Bodyweight Squats", details: "3 sets × 15 reps" },
                        { name: "Lunges", details: "3 sets × 12 each leg" },
                        { name: "Wall Sit", details: "3 sets × 30-45 seconds" },
                        { name: "Calf Raises", details: "3 sets × 20 reps" },
                        { name: "Glute Bridges", details: "3 sets × 15 reps" }
                    ],
                    30: [
                        { name: "Bodyweight Squats", details: "4 sets × 20 reps" },
                        { name: "Lunges", details: "4 sets × 15 each leg" },
                        { name: "Single-Leg Squats", details: "3 sets × 8 each leg" },
                        { name: "Wall Sit", details: "4 sets × 45-60 seconds" },
                        { name: "Calf Raises", details: "4 sets × 25 reps" },
                        { name: "Glute Bridges", details: "4 sets × 20 reps" },
                        { name: "Side Lunges", details: "3 sets × 12 each side" }
                    ],
                    45: [
                        { name: "Bodyweight Squats", details: "5 sets × 25 reps" },
                        { name: "Lunges", details: "5 sets × 20 each leg" },
                        { name: "Single-Leg Squats", details: "4 sets × 12 each leg" },
                        { name: "Wall Sit", details: "5 sets × 60-90 seconds" },
                        { name: "Calf Raises", details: "5 sets × 30 reps" },
                        { name: "Glute Bridges", details: "5 sets × 25 reps" },
                        { name: "Side Lunges", details: "4 sets × 15 each side" },
                        { name: "Single-Leg Glute Bridges", details: "3 sets × 12 each leg" },
                        { name: "Leg Stretches", details: "5 minutes" }
                    ]
                }
            },
            3: { // Day 4 - HIIT & Flexibility
                title: "HIIT & Flexibility",
                exercises: {
                    20: [
                        { name: "Burpees (step back/forward)", details: "3 rounds × 30 seconds" },
                        { name: "High Knees", details: "3 rounds × 30 seconds" },
                        { name: "Push-ups", details: "3 rounds × 20 seconds" },
                        { name: "Rest", details: "30 seconds between rounds" },
                        { name: "Full Body Stretch", details: "5 minutes" }
                    ],
                    30: [
                        { name: "Burpees (step back/forward)", details: "4 rounds × 45 seconds" },
                        { name: "High Knees", details: "4 rounds × 45 seconds" },
                        { name: "Push-ups", details: "4 rounds × 30 seconds" },
                        { name: "Plank", details: "4 rounds × 30 seconds" },
                        { name: "Rest", details: "45 seconds between rounds" },
                        { name: "Full Body Stretch", details: "8 minutes" }
                    ],
                    45: [
                        { name: "Burpees (step back/forward)", details: "6 rounds × 45 seconds" },
                        { name: "High Knees", details: "6 rounds × 45 seconds" },
                        { name: "Push-ups", details: "6 rounds × 30 seconds" },
                        { name: "Mountain Climbers", details: "6 rounds × 30 seconds" },
                        { name: "Plank", details: "6 rounds × 30 seconds" },
                        { name: "Rest", details: "60 seconds between rounds" },
                        { name: "Deep Flexibility Session", details: "10 minutes" },
                        { name: "Cool Down Walk", details: "5 minutes" }
                    ]
                }
            },
            4: { // Day 5 - Full Body Circuit
                title: "Full Body Circuit",
                exercises: {
                    20: [
                        { name: "Push-ups", details: "2 sets × 10 reps" },
                        { name: "Squats", details: "2 sets × 15 reps" },
                        { name: "Plank", details: "2 sets × 30 seconds" },
                        { name: "Lunges", details: "2 sets × 10 each leg" },
                        { name: "Tricep Dips", details: "2 sets × 10 reps" },
                        { name: "Glute Bridges", details: "2 sets × 15 reps" }
                    ],
                    30: [
                        { name: "Push-ups", details: "3 sets × 12 reps" },
                        { name: "Squats", details: "3 sets × 20 reps" },
                        { name: "Plank", details: "3 sets × 45 seconds" },
                        { name: "Lunges", details: "3 sets × 12 each leg" },
                        { name: "Tricep Dips", details: "3 sets × 12 reps" },
                        { name: "Glute Bridges", details: "3 sets × 18 reps" },
                        { name: "Russian Twists", details: "3 sets × 25 reps" },
                        { name: "Calf Raises", details: "3 sets × 20 reps" }
                    ],
                    45: [
                        { name: "Push-ups", details: "4 sets × 15 reps" },
                        { name: "Squats", details: "4 sets × 25 reps" },
                        { name: "Plank", details: "4 sets × 60 seconds" },
                        { name: "Lunges", details: "4 sets × 15 each leg" },
                        { name: "Tricep Dips", details: "4 sets × 15 reps" },
                        { name: "Glute Bridges", details: "4 sets × 22 reps" },
                        { name: "Russian Twists", details: "4 sets × 35 reps" },
                        { name: "Calf Raises", details: "4 sets × 25 reps" },
                        { name: "Side Plank", details: "3 sets × 30 seconds each side" },
                        { name: "Full Body Stretch", details: "8 minutes" }
                    ]
                }
            }
        };

        let timerInterval;
        let timerSeconds = 0;
        let isTimerRunning = false;

        function generateWorkout() {
            const daySelect = document.getElementById('daySelect').value;
            const duration = parseInt(document.getElementById('durationSelect').value);
            const container = document.getElementById('workoutContainer');
            const timerSection = document.getElementById('timerSection');
            
            container.innerHTML = '';
            timerSection.style.display = 'block';
            resetTimer();

            if (daySelect === 'all') {
                // Show all days
                for (let i = 0; i < 5; i++) {
                    createDayCard(i, duration, container);
                }
            } else {
                // Show selected day
                createDayCard(parseInt(daySelect), duration, container);
            }
        }

        function createDayCard(dayIndex, duration, container) {
            const dayData = workoutData[dayIndex];
            const exercises = dayData.exercises[duration];
            const dayNames = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

            const card = document.createElement('div');
            card.className = 'day-card';
            card.innerHTML = `
                <h2 class="day-title">${dayNames[dayIndex]}</h2>
                <h3 style="text-align: center; margin-bottom: 1rem;">${dayData.title}</h3>
                <div class="duration-badge">${duration} Minutes</div>
                <ul class="exercise-list">
                    ${exercises.map(exercise => `
                        <li class="exercise-item">
                            <div class="exercise-name">${exercise.name}</div>
                            <div class="exercise-details">${exercise.details}</div>
                        </li>
                    `).join('')}
                </ul>
            `;
            
            container.appendChild(card);
        }

        function startTimer() {
            const btn = document.getElementById('timerBtn');
            const duration = parseInt(document.getElementById('durationSelect').value) * 60;
            
            if (!isTimerRunning) {
                isTimerRunning = true;
                btn.textContent = 'Pause Timer';
                
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    updateTimerDisplay();
                    
                    if (timerSeconds >= duration) {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        btn.textContent = 'Start Timer';
                        alert('🎉 Workout Complete! Great job!');
                    }
                }, 1000);
            } else {
                clearInterval(timerInterval);
                isTimerRunning = false;
                btn.textContent = 'Resume Timer';
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerSeconds = 0;
            isTimerRunning = false;
            document.getElementById('timerBtn').textContent = 'Start Timer';
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timerSeconds / 60);
            const seconds = timerSeconds % 60;
            document.getElementById('timerDisplay').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Initialize with default workout
        generateWorkout();
    </script>
</body>
</html>
